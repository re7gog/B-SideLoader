name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/keystore.p12
          file ${{ github.workspace }}/keystore.p12

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          MASK_SECRET: ${{ secrets.MASK_SECRET }}
          ID_SECRET: ${{ secrets.ID_SECRET }}
          HASH_SECRET: ${{ secrets.HASH_SECRET }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk

      - name: Upload x86 APK
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: x86-apk
          path: app/build/outputs/apk/release/*x86*.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        if: ${{ success() }}
        with:
          name: universal-apk
          path: app/build/outputs/apk/release/*universal*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-files

      - name: Upload APKs to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: false
